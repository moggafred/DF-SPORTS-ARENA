<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 2 - Select Date & Time</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #fff;
        }
        .card {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid #e94560;
            max-width: 700px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e94560;
        }
        .step-badge {
            display: inline-block;
            background: #e94560;
            color: #fff;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2.5em;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .content {
            text-align: center;
        }
        .icon {
            font-size: 6em;
            margin-bottom: 30px;
        }
        .content h2 {
            font-size: 1.8em;
            color: #fff;
            margin-bottom: 20px;
        }
        .content p {
            color: #ccc;
            font-size: 1.3em;
            line-height: 1.8;
        }
        .highlight {
            color: #e94560;
            font-weight: bold;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(233, 69, 96, 0.3);
        }
        .footer p {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="step-badge">STEP 2</div>
            <h1>Select Date & Time</h1>
        </div>
        <div class="content">
            <div class="icon">📅</div>
            <h2>Choose Your Playing Date</h2>
            <p>Select the <span class="highlight">date</span> you want to play from the calendar.</p>
            <p>Choose your <span class="highlight">preferred time slot</span> that is available.</p>
            <p>Book early to secure your preferred time!</p>
        </div>
        <div class="footer">
            <p>Natz Sports Arena - Adjumani, Uganda</p>
        </div>
    </div>
</body>
</html>
