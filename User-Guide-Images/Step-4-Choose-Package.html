<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 4 - Choose Package</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #fff;
        }
        .card {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid #e94560;
            max-width: 700px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #e94560;
        }
        .step-badge {
            display: inline-block;
            background: #e94560;
            color: #fff;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2.5em;
            color: #e94560;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .content {
            text-align: center;
        }
        .icon {
            font-size: 6em;
            margin-bottom: 30px;
        }
        .content h2 {
            font-size: 1.8em;
            color: #fff;
            margin-bottom: 20px;
        }
        .packages {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        .package {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: border-color 0.3s;
        }
        .package:hover {
            border-color: #e94560;
        }
        .package-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .package h3 {
            color: #e94560;
            margin-bottom: 5px;
        }
        .package p {
            color: #ccc;
            font-size: 0.9em;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(233, 69, 96, 0.3);
        }
        .footer p {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="step-badge">STEP 4</div>
            <h1>Choose Your Package</h1>
        </div>
        <div class="content">
            <div class="icon">📦</div>
            <h2>Select Your Preferred Package</h2>
            <div class="packages">
                <div class="package">
                    <div class="package-icon">⏰</div>
                    <h3>1 Hour</h3>
                    <p>Quick Practice</p>
                </div>
                <div class="package">
                    <div class="package-icon">🏆</div>
                    <h3>2 Hours</h3>
                    <p>Competitive Match</p>
                </div>
                <div class="package">
                    <div class="package-icon">🎉</div>
                    <h3>Tournament</h3>
                    <p>Full Day</p>
                </div>
            </div>
        </div>
        <div class="footer">
            <p>Natz Sports Arena - Adjumani, Uganda</p>
        </div>
    </div>
</body>
</html>
