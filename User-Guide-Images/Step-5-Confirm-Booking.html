<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step 5 - Confirm Booking</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #fff;
        }
        .card {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid #28a745;
            max-width: 700px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #28a745;
        }
        .step-badge {
            display: inline-block;
            background: #28a745;
            color: #fff;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2.5em;
            color: #28a745;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .content {
            text-align: center;
        }
        .icon {
            font-size: 6em;
            margin-bottom: 30px;
        }
        .content h2 {
            font-size: 1.8em;
            color: #fff;
            margin-bottom: 20px;
        }
        .content p {
            color: #ccc;
            font-size: 1.2em;
            line-height: 1.8;
        }
        .success-box {
            background: rgba(40, 167, 69, 0.2);
            border: 2px solid #28a745;
            padding: 25px;
            border-radius: 12px;
            margin-top: 25px;
        }
        .success-box h3 {
            color: #28a745;
            margin-bottom: 10px;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(40, 167, 69, 0.3);
        }
        .footer p {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="step-badge">STEP 5</div>
            <h1>Confirm Booking</h1>
        </div>
        <div class="content">
            <div class="icon">✅</div>
            <h2>Review & Submit</h2>
            <p>Review your booking details and click <strong>Submit</strong></p>
            <div class="success-box">
                <h3>You'll Receive WhatsApp Confirmation!</h3>
                <p>Your booking will be confirmed via WhatsApp message.</p>
                <p>Payment can be made upon arrival at the arena.</p>
            </div>
        </div>
        <div class="footer">
            <p>Natz Sports Arena - Adjumani, Uganda</p>
        </div>
    </div>
</body>
</html>
