<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Natz Sports Arena</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-green: #006400;
            --dark-green: #004d00;
            --accent-gold: #ffd700;
        }
        body {
            background: linear-gradient(135deg, var(--primary-green) 0%, var(--dark-green) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            max-width: 450px;
            width: 100%;
        }
        .login-header {
            background: var(--primary-green);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .login-header i {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .login-body {
            padding: 40px;
        }
        .form-control:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 0.2rem rgba(0, 100, 0, 0.25);
        }
        .btn-login {
            background: var(--primary-green);
            color: white;
            border: none;
            padding: 12px;
            font-weight: 600;
        }
        .btn-login:hover {
            background: var(--dark-green);
            color: white;
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-futbol"></i>
            <h2>Natz Sports Arena</h2>
            <p>Admin Dashboard</p>
        </div>
        <div class="login-body">
            <div id="alertContainer"></div>
            <div id="warningMessage"></div>
            <div id="debugStatus" class="mb-3 text-center text-muted"></div>
            <form id="loginForm">
                <div class="mb-4">
                    <label class="form-label">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" required placeholder="admin@natzsportsarena.com">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" required placeholder="Enter password">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="mb-4 form-check">
                    <input type="checkbox" class="form-check-input" id="remember">
                    <label class="form-check-label" for="remember">Remember me</label>
                </div>
                <button type="submit" class="btn btn-login w-100" id="loginBtn">
                    <span id="loginText">Login</span>
                    <span id="loginSpinner" class="spinner-border spinner-border-sm ms-2 d-none"></span>
                </button>
            </form>
            <div class="text-center mt-4">
                <a href="../index.html" class="text-decoration-none">
                    <i class="fas fa-arrow-left me-1"></i> Back to Website
                </a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.protocol.startsWith('http')
            ? `${window.location.protocol}//${window.location.host}/api`
            : 'http://localhost:5001/api';

        const debugStatus = document.getElementById('debugStatus');
        const warningMessage = document.getElementById('warningMessage');
        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        const originStatus = `URL=${window.location.href} ORIGIN=${window.location.origin} API_URL=${API_URL}`;
        if (debugStatus) {
            debugStatus.textContent = `Login script loaded. ${originStatus}`;
        }

        if (!window.location.protocol.startsWith('http')) {
            if (warningMessage) {
                warningMessage.innerHTML = `
                    <div class="alert alert-warning" role="alert">
                        This login page is being opened from the filesystem. Please open it through the backend server URL instead:
                        <strong>http://localhost:5001/admin/login.html</strong>
                    </div>`;
            }
        }

        window.addEventListener('error', (event) => {
            showAlert('Client-side error: ' + event.message, 'danger');
            console.error('Login page error:', event.error || event.message);
        });

        if (!loginForm) {
            if (debugStatus) debugStatus.textContent = `Login form missing (${originStatus})`;
        } else {
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const loginText = document.getElementById('loginText');
            const loginSpinner = document.getElementById('loginSpinner');
            
            loginBtn.disabled = true;
            loginText.textContent = 'Logging in...';
            loginSpinner.classList.remove('d-none');
            
            try {
                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                let data;
                try {
                    data = await response.json();
                } catch (jsonError) {
                    console.error('Failed to parse JSON response:', jsonError);
                    showAlert('Server returned an invalid response. Check console for details.', 'danger');
                    return;
                }
                
                console.log('Login response:', response.status, data);
                
                if (response.ok && data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    const detailMessage = data.message || (data.errors && data.errors.map(err => `${err.field}: ${err.message}`).join(', '));
                            showAlert(detailMessage || `Login failed (${response.status})`, 'danger');
                }
            } catch (error) {
                console.error('Login request failed:', error);
                showAlert('Unable to connect to server. Please try again.', 'danger');
            } finally {
                loginBtn.disabled = false;
                loginText.textContent = 'Login';
                loginSpinner.classList.add('d-none');
            }
        });
        }


        document.getElementById('togglePassword').addEventListener('click', () => {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('#togglePassword i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        function showAlert(message, type) {
            const container = document.getElementById('alertContainer');
            container.innerHTML = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
        }

        // Clear any stale auth data before showing the login form.
        // This prevents old or invalid tokens from redirecting the user away.
        if (localStorage.getItem('token')) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
