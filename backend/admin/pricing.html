<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing - Natz Sports Arena Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-green: #006400; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        .sidebar { background: var(--primary-green); min-height: 100vh; position: fixed; width: 250px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .main-content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .pricing-card { border: 2px solid #eee; transition: all 0.3s; }
        .pricing-card:hover { border-color: var(--primary-green); transform: translateY(-5px); }
        .pricing-card.popular { border-color: var(--primary-green); }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <h4 class="text-white mb-0"><i class="fas fa-futbol me-2"></i>Natz Sports</h4>
            <small class="text-white-50">Admin Panel</small>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
            <li class="nav-item"><a class="nav-link" href="matches.html"><i class="fas fa-futbol"></i> Matches</a></li>
            <li class="nav-item"><a class="nav-link" href="flyers.html"><i class="fas fa-image"></i> Flyers</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html"><i class="fas fa-photo-video"></i> Gallery</a></li>
            <li class="nav-item"><a class="nav-link active" href="pricing.html"><i class="fas fa-tag"></i> Pricing</a></li>
            <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <h3 class="mb-4"><i class="fas fa-tag me-2"></i>Pricing Management</h3>

        <div id="alertContainer"></div>

        <div class="row" id="pricingContainer">
            <div class="col-12 text-center py-5">Loading...</div>
        </div>
    </div>

    <div class="modal fade" id="priceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Edit Pricing</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="priceForm">
                    <div class="modal-body">
                        <input type="hidden" name="id" id="priceId">
                        <div class="mb-3">
                            <label class="form-label">Price (UGX)</label>
                            <input type="number" class="form-control" name="price" id="priceValue" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" id="priceDesc" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        let currentPricing = null;
        const modal = new bootstrap.Modal(document.getElementById('priceModal'));

        async function loadPricingList() {
            const pricing = await loadPricing();
            const container = document.getElementById('pricingContainer');

            if (pricing.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No pricing found</div>';
                return;
            }

            container.innerHTML = pricing.map(p => `
                <div class="col-lg-4 mb-4">
                    <div class="card pricing-card ${p.isPopular ? 'popular' : ''}">
                        ${p.isPopular ? '<div class="card-header bg-success text-white text-center"><span class="badge bg-warning text-dark">Most Popular</span></div>' : ''}
                        <div class="card-body text-center">
                            <h4 class="text-success">${p.name}</h4>
                            <h2 class="my-4">${formatCurrency(p.price).replace('UGX', '')} <small class="text-muted">UGX</small></h2>
                            <p class="text-muted">${p.description || ''}</p>
                            <p><small>Duration: ${p.duration || 'N/A'}</small></p>
                            <button class="btn btn-outline-success mt-3" onclick="editPrice('${p._id}')">
                                <i class="fas fa-edit me-2"></i>Edit Price
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function editPrice(id) {
            const pricing = await loadPricing();
            currentPricing = pricing.find(p => p._id === id);
            if (!currentPricing) return;

            document.getElementById('priceId').value = currentPricing._id;
            document.getElementById('priceValue').value = currentPricing.price;
            document.getElementById('priceDesc').value = currentPricing.description || '';
            modal.show();
        }

        document.getElementById('priceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('priceId').value;
            const data = {
                price: parseInt(document.getElementById('priceValue').value),
                description: document.getElementById('priceDesc').value
            };

            try {
                await apiCall(`/pricing/${id}`, 'PUT', data);
                showAlert('Price updated successfully');
                modal.hide();
                loadPricingList();
            } catch (error) {
                showAlert('Failed to update price', 'danger');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadPricingList();
    </script>
</body>
</html>
