<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matches - Natz Sports Arena Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-green: #006400; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        .sidebar { background: var(--primary-green); min-height: 100vh; position: fixed; width: 250px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .main-content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .match-card { border-left: 4px solid var(--primary-green); }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <h4 class="text-white mb-0"><i class="fas fa-futbol me-2"></i>Natz Sports</h4>
            <small class="text-white-50">Admin Panel</small>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
            <li class="nav-item"><a class="nav-link active" href="matches.html"><i class="fas fa-futbol"></i> Matches</a></li>
            <li class="nav-item"><a class="nav-link" href="flyers.html"><i class="fas fa-image"></i> Flyers</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html"><i class="fas fa-photo-video"></i> Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="pricing.html"><i class="fas fa-tag"></i> Pricing</a></li>
            <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="fas fa-futbol me-2"></i>Matches Management</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#matchModal">
                <i class="fas fa-plus me-2"></i>Add Match
            </button>
        </div>

        <div id="alertContainer"></div>

        <div class="row" id="matchesContainer">
            <div class="col-12 text-center py-5">Loading...</div>
        </div>
    </div>

    <div class="modal fade" id="matchModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Add New Match</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="matchForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Team A</label>
                            <input type="text" class="form-control" name="teamA" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Team B</label>
                            <input type="text" class="form-control" name="teamB" required>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-control" name="date" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Time</label>
                                <input type="text" class="form-control" name="time" placeholder="e.g., 3:00 PM" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Tournament</label>
                            <input type="text" class="form-control" name="tournament" required>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Save Match</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        const modal = new bootstrap.Modal(document.getElementById('matchModal'));

        async function loadMatchesList() {
            const matches = await loadMatches();
            const container = document.getElementById('matchesContainer');

            if (matches.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No matches found</div>';
                return;
            }

            container.innerHTML = matches.map(m => `
                <div class="col-lg-6 mb-4">
                    <div class="card match-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <span class="badge bg-success">${m.status}</span>
                                <span class="text-muted small">${m.tournament}</span>
                            </div>
                            <div class="text-center py-3">
                                <h4 class="mb-0">${m.teamA} <span class="text-success mx-2">VS</span> ${m.teamB}</h4>
                            </div>
                            <div class="d-flex justify-content-center text-muted">
                                <span class="me-4"><i class="fas fa-calendar me-1"></i>${formatDate(m.date)}</span>
                                <span><i class="fas fa-clock me-1"></i>${m.time}</span>
                            </div>
                            <hr>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-sm btn-outline-success" onclick="editMatch('${m._id}')">
                                    <i class="fas fa-edit"></i> Edit
                                </button>
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteMatch('${m._id}')">
                                    <i class="fas fa-trash"></i> Delete
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('matchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            data.date = new Date(data.date).toISOString();

            try {
                await apiCall('/matches', 'POST', data);
                showAlert('Match created successfully');
                modal.hide();
                e.target.reset();
                loadMatchesList();
            } catch (error) {
                showAlert('Failed to create match', 'danger');
            }
        });

        async function deleteMatch(id) {
            if (!confirm('Are you sure you want to delete this match?')) return;
            try {
                await apiCall(`/matches/${id}`, 'DELETE');
                showAlert('Match deleted successfully');
                loadMatchesList();
            } catch (error) {
                showAlert('Failed to delete match', 'danger');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadMatchesList();
    </script>
</body>
</html>
