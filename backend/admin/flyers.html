<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flyers - DF Sports Arena Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-green: #006400; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        .sidebar { background: var(--primary-green); min-height: 100vh; position: fixed; width: 250px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .main-content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .flyer-card { transition: transform 0.3s; }
        .flyer-card:hover { transform: translateY(-5px); }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <h4 class="text-white mb-0"><i class="fas fa-futbol me-2"></i>DF Sports</h4>
            <small class="text-white-50">Admin Panel</small>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
            <li class="nav-item"><a class="nav-link" href="matches.html"><i class="fas fa-futbol"></i> Matches</a></li>
            <li class="nav-item"><a class="nav-link active" href="flyers.html"><i class="fas fa-image"></i> Flyers</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html"><i class="fas fa-photo-video"></i> Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="pricing.html"><i class="fas fa-tag"></i> Pricing</a></li>
            <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="fas fa-image me-2"></i>Event Flyers</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#flyerModal">
                <i class="fas fa-plus me-2"></i>Add Flyer
            </button>
        </div>

        <div id="alertContainer"></div>

        <div class="row" id="flyersContainer">
            <div class="col-12 text-center py-5">Loading...</div>
        </div>
    </div>

    <div class="modal fade" id="flyerModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Add Event Flyer</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="flyerForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" name="title" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" name="imageUrl" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Date</label>
                                <input type="date" class="form-control" name="date" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Time</label>
                                <input type="text" class="form-control" name="time" placeholder="e.g., 3:00 PM" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" name="description" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Save</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        const modal = new bootstrap.Modal(document.getElementById('flyerModal'));

        async function loadFlyersList() {
            const flyers = await loadFlyers();
            const container = document.getElementById('flyersContainer');

            if (flyers.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No flyers found</div>';
                return;
            }

            container.innerHTML = flyers.map(f => `
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="card flyer-card">
                        <img src="${f.imageUrl}" class="card-img-top" style="height: 200px; object-fit: cover;" alt="${f.title}">
                        <div class="card-body">
                            <h5 class="card-title">${f.title}</h5>
                            <p class="text-muted small mb-1">
                                <i class="fas fa-calendar me-1"></i>${formatDate(f.date)}
                            </p>
                            <p class="text-muted small mb-2">
                                <i class="fas fa-clock me-1"></i>${f.time}
                            </p>
                            <p class="card-text small">${f.description || ''}</p>
                            <div class="d-flex justify-content-between">
                                <button class="btn btn-sm btn-outline-danger" onclick="deleteFlyer('${f._id}')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('flyerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            data.date = new Date(data.date).toISOString();

            try {
                await apiCall('/flyers', 'POST', data);
                showAlert('Flyer created successfully');
                modal.hide();
                e.target.reset();
                loadFlyersList();
            } catch (error) {
                showAlert('Failed to create flyer', 'danger');
            }
        });

        async function deleteFlyer(id) {
            if (!confirm('Delete this flyer?')) return;
            try {
                await apiCall(`/flyers/${id}`, 'DELETE');
                showAlert('Flyer deleted successfully');
                loadFlyersList();
            } catch (error) {
                showAlert('Failed to delete flyer', 'danger');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadFlyersList();
    </script>
</body>
</html>
