<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Natz Sports Arena Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-green: #006400; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        .sidebar { background: var(--primary-green); min-height: 100vh; position: fixed; width: 250px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .main-content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .gallery-item { position: relative; overflow: hidden; border-radius: 10px; }
        .gallery-item img { transition: transform 0.3s; }
        .gallery-item:hover img { transform: scale(1.1); }
        .gallery-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; }
        .gallery-item:hover .gallery-overlay { opacity: 1; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <h4 class="text-white mb-0"><i class="fas fa-futbol me-2"></i>Natz Sports</h4>
            <small class="text-white-50">Admin Panel</small>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
            <li class="nav-item"><a class="nav-link" href="matches.html"><i class="fas fa-futbol"></i> Matches</a></li>
            <li class="nav-item"><a class="nav-link" href="flyers.html"><i class="fas fa-image"></i> Flyers</a></li>
            <li class="nav-item"><a class="nav-link active" href="gallery.html"><i class="fas fa-photo-video"></i> Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="pricing.html"><i class="fas fa-tag"></i> Pricing</a></li>
            <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="fas fa-photo-video me-2"></i>Gallery Management</h3>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#uploadModal">
                <i class="fas fa-upload me-2"></i>Upload Image
            </button>
        </div>

        <div id="alertContainer"></div>

        <div class="row" id="galleryContainer">
            <div class="col-12 text-center py-5">Loading...</div>
        </div>
    </div>

    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Upload Image</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <form id="uploadForm">
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" class="form-control" name="imageUrl" placeholder="https://..." required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Alt Text</label>
                            <input type="text" class="form-control" name="altText" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-control" name="category">
                                <option value="general">General</option>
                                <option value="matches">Matches</option>
                                <option value="training">Training</option>
                                <option value="events">Events</option>
                                <option value="facilities">Facilities</option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">Upload</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        const modal = new bootstrap.Modal(document.getElementById('uploadModal'));

        async function loadGalleryList() {
            const images = await loadGallery();
            const container = document.getElementById('galleryContainer');

            if (images.length === 0) {
                container.innerHTML = '<div class="col-12 text-center py-5 text-muted">No images found</div>';
                return;
            }

            container.innerHTML = images.map(img => `
                <div class="col-lg-3 col-md-4 col-sm-6 mb-4">
                    <div class="gallery-item shadow">
                        <img src="${img.imageUrl}" class="img-fluid w-100" style="height: 200px; object-fit: cover;" alt="${img.altText}">
                        <div class="gallery-overlay">
                            <button class="btn btn-danger btn-sm me-2" onclick="deleteImage('${img._id}')">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                        <div class="p-2 bg-white">
                            <small class="text-muted text-capitalize">${img.category}</small>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);

            try {
                await apiCall('/gallery', 'POST', {
                    imageUrl: formData.get('imageUrl'),
                    altText: formData.get('altText'),
                    category: formData.get('category')
                });
                showAlert('Image added successfully');
                modal.hide();
                e.target.reset();
                loadGalleryList();
            } catch (error) {
                showAlert('Failed to add image', 'danger');
            }
        });

        async function deleteImage(id) {
            if (!confirm('Delete this image?')) return;
            try {
                await apiCall(`/gallery/${id}`, 'DELETE');
                showAlert('Image deleted successfully');
                loadGalleryList();
            } catch (error) {
                showAlert('Failed to delete image', 'danger');
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadGalleryList();
    </script>
</body>
</html>
