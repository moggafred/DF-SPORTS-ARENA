<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookings - Natz Sports Arena Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-green: #006400; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        .sidebar { background: var(--primary-green); min-height: 100vh; position: fixed; width: 250px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .main-content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
        .table thead th { border-bottom: 2px solid var(--primary-green); color: var(--primary-green); }
        .badge-pending { background: #f57c00; }
        .badge-confirmed { background: #388e3c; }
        .badge-cancelled { background: #d32f2f; }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <h4 class="text-white mb-0"><i class="fas fa-futbol me-2"></i>Natz Sports</h4>
            <small class="text-white-50">Admin Panel</small>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
            <li class="nav-item"><a class="nav-link" href="matches.html"><i class="fas fa-futbol"></i> Matches</a></li>
            <li class="nav-item"><a class="nav-link" href="flyers.html"><i class="fas fa-image"></i> Flyers</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html"><i class="fas fa-photo-video"></i> Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="pricing.html"><i class="fas fa-tag"></i> Pricing</a></li>
            <li class="nav-item"><a class="nav-link" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3><i class="fas fa-calendar-check me-2"></i>Bookings Management</h3>
            <div>
                <select class="form-select" id="statusFilter" style="width: 200px;">
                    <option value="">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="cancelled">Cancelled</option>
                    <option value="completed">Completed</option>
                </select>
            </div>
        </div>

        <div id="alertContainer"></div>

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Customer</th>
                                <th>Contact</th>
                                <th>Type</th>
                                <th>Date & Time</th>
                                <th>Players</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="bookingsTable">
                            <tr><td colspan="7" class="text-center py-5">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
                <nav id="pagination"></nav>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bookingModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header bg-success text-white">
                    <h5 class="modal-title">Booking Details</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="bookingModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-danger" id="cancelBookingBtn">Cancel Booking</button>
                    <button type="button" class="btn btn-success" id="confirmBookingBtn">Confirm Booking</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        let currentBooking = null;
        const modal = new bootstrap.Modal(document.getElementById('bookingModal'));

        async function loadBookingsList(status = '', page = 1) {
            const data = await loadBookings(status, page);
            const tbody = document.getElementById('bookingsTable');

            if (data.bookings.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-5">No bookings found</td></tr>';
                return;
            }

            tbody.innerHTML = data.bookings.map(b => `
                <tr>
                    <td><strong>${b.customerName}</strong></td>
                    <td>
                        <small>${b.customerPhone}</small><br>
                        <small class="text-muted">${b.customerEmail || 'N/A'}</small>
                    </td>
                    <td><span class="text-capitalize">${b.bookingType}</span></td>
                    <td>
                        ${formatDate(b.preferredDate)}<br>
                        <small class="text-muted">${b.preferredTime}</small>
                    </td>
                    <td>${b.numberOfPlayers}</td>
                    <td>${getStatusBadge(b.status)}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-success me-1" onclick="viewBooking('${b._id}')">
                            <i class="fas fa-eye"></i>
                        </button>
                        ${b.status === 'pending' ? `
                            <button class="btn btn-sm btn-success me-1" onclick="updateStatus('${b._id}', 'confirmed')">
                                <i class="fas fa-check"></i>
                            </button>
                        ` : ''}
                    </td>
                </tr>
            `).join('');

            renderPagination(data.pagination);
        }

        async function viewBooking(id) {
            try {
                const data = await apiCall(`/bookings/${id}`);
                currentBooking = data.data.booking;

                document.getElementById('bookingModalBody').innerHTML = `
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Customer:</strong> ${currentBooking.customerName}</p>
                            <p><strong>Phone:</strong> ${currentBooking.customerPhone}</p>
                            <p><strong>Email:</strong> ${currentBooking.customerEmail || 'N/A'}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Type:</strong> ${currentBooking.bookingType}</p>
                            <p><strong>Date:</strong> ${formatDate(currentBooking.preferredDate)}</p>
                            <p><strong>Time:</strong> ${currentBooking.preferredTime}</p>
                            <p><strong>Duration:</strong> ${currentBooking.duration} hour(s)</p>
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-6">
                            <p><strong>Players:</strong> ${currentBooking.numberOfPlayers}</p>
                            <p><strong>Team:</strong> ${currentBooking.teamName || 'N/A'}</p>
                        </div>
                        <div class="col-md-6">
                            <p><strong>Status:</strong> ${getStatusBadge(currentBooking.status)}</p>
                            <p><strong>Created:</strong> ${formatDate(currentBooking.createdAt)}</p>
                        </div>
                    </div>
                    ${currentBooking.notes ? `<hr><p><strong>Notes:</strong> ${currentBooking.notes}</p>` : ''}
                `;

                document.getElementById('confirmBookingBtn').style.display = currentBooking.status === 'pending' ? 'inline-block' : 'none';
                document.getElementById('cancelBookingBtn').style.display = currentBooking.status === 'pending' ? 'inline-block' : 'none';

                modal.show();
            } catch (error) {
                showAlert('Failed to load booking details', 'danger');
            }
        }

        async function updateStatus(id, status) {
            try {
                await apiCall(`/bookings/${id}`, 'PUT', { status });
                showAlert(`Booking ${status} successfully`);
                loadBookingsList(document.getElementById('statusFilter').value);
            } catch (error) {
                showAlert('Failed to update booking', 'danger');
            }
        }

        document.getElementById('confirmBookingBtn').addEventListener('click', () => {
            if (currentBooking) {
                updateStatus(currentBooking._id, 'confirmed');
                modal.hide();
            }
        });

        document.getElementById('cancelBookingBtn').addEventListener('click', () => {
            if (currentBooking) {
                updateStatus(currentBooking._id, 'cancelled');
                modal.hide();
            }
        });

        document.getElementById('statusFilter').addEventListener('change', (e) => {
            loadBookingsList(e.target.value);
        });

        function renderPagination(pagination) {
            const container = document.getElementById('pagination');
            if (pagination.pages <= 1) {
                container.innerHTML = '';
                return;
            }

            let html = '<ul class="pagination justify-content-center">';
            for (let i = 1; i <= pagination.pages; i++) {
                html += `<li class="page-item ${i === pagination.page ? 'active' : ''}">
                    <a class="page-link" href="#" onclick="loadBookingsList(document.getElementById('statusFilter').value, ${i}); return false;">${i}</a>
                </li>`;
            }
            html += '</ul>';
            container.innerHTML = html;
        }

        document.getElementById('logoutBtn').addEventListener('click', logout);

        loadBookingsList();
    </script>
</body>
</html>
