<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Natz Sports Arena Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-green: #006400; }
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; }
        .sidebar { background: var(--primary-green); min-height: 100vh; position: fixed; width: 250px; }
        .sidebar .nav-link { color: rgba(255,255,255,0.8); padding: 12px 20px; border-radius: 8px; margin: 5px 15px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
        .main-content { margin-left: 250px; padding: 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="p-4 text-center border-bottom border-secondary">
            <h4 class="text-white mb-0"><i class="fas fa-futbol me-2"></i>Natz Sports</h4>
            <small class="text-white-50">Admin Panel</small>
        </div>
        <ul class="nav flex-column mt-3">
            <li class="nav-item"><a class="nav-link" href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="bookings.html"><i class="fas fa-calendar-check"></i> Bookings</a></li>
            <li class="nav-item"><a class="nav-link" href="matches.html"><i class="fas fa-futbol"></i> Matches</a></li>
            <li class="nav-item"><a class="nav-link" href="flyers.html"><i class="fas fa-image"></i> Flyers</a></li>
            <li class="nav-item"><a class="nav-link" href="gallery.html"><i class="fas fa-photo-video"></i> Gallery</a></li>
            <li class="nav-item"><a class="nav-link" href="pricing.html"><i class="fas fa-tag"></i> Pricing</a></li>
            <li class="nav-item"><a class="nav-link active" href="settings.html"><i class="fas fa-cog"></i> Settings</a></li>
            <li class="nav-item mt-4"><a class="nav-link text-danger" href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
    </nav>

    <div class="main-content">
        <h3 class="mb-4"><i class="fas fa-cog me-2"></i>Arena Settings</h3>

        <div id="alertContainer"></div>

        <form id="settingsForm">
            <div class="row g-4">
                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-info-circle me-2"></i>Basic Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Arena Name</label>
                                <input type="text" class="form-control" name="arenaName" id="arenaName">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Tagline</label>
                                <input type="text" class="form-control" name="tagline" id="tagline">
                            </div>
                        </div>
                    </div>

                    <div class="card mt-4">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-clock me-2"></i>Operating Hours</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">Opening Time</label>
                                    <input type="text" class="form-control" name="openTime" id="openTime" placeholder="06:00">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Closing Time</label>
                                    <input type="text" class="form-control" name="closeTime" id="closeTime" placeholder="22:00">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-phone me-2"></i>Contact Information</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" name="phone" id="phone">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">WhatsApp</label>
                                <input type="text" class="form-control" name="whatsapp" id="whatsapp">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" name="email" id="email">
                            </div>
                        </div>
                    </div>

                    <div class="card mt-4">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-map-marker-alt me-2"></i>Address</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label">Street</label>
                                <input type="text" class="form-control" name="street" id="street">
                            </div>
                            <div class="row">
                                <div class="col-6 mb-3">
                                    <label class="form-label">District</label>
                                    <input type="text" class="form-control" name="district" id="district">
                                </div>
                                <div class="col-6 mb-3">
                                    <label class="form-label">Country</label>
                                    <input type="text" class="form-control" name="country" id="country">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0"><i class="fas fa-share-alt me-2"></i>Social Links</h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Facebook</label>
                                    <input type="url" class="form-control" name="facebook" id="facebook">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Instagram</label>
                                    <input type="url" class="form-control" name="instagram" id="instagram">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Twitter</label>
                                    <input type="url" class="form-control" name="twitter" id="twitter">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">LinkedIn</label>
                                    <input type="url" class="form-control" name="linkedin" id="linkedin">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-success btn-lg">
                        <i class="fas fa-save me-2"></i>Save Settings
                    </button>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
        async function loadSettingsForm() {
            const settings = await loadSettings();
            if (!settings) return;

            document.getElementById('arenaName').value = settings.arenaName || '';
            document.getElementById('tagline').value = settings.tagline || '';
            document.getElementById('phone').value = settings.phone || '';
            document.getElementById('whatsapp').value = settings.whatsapp || '';
            document.getElementById('email').value = settings.email || '';
            document.getElementById('street').value = settings.address?.street || '';
            document.getElementById('district').value = settings.address?.district || '';
            document.getElementById('country').value = settings.address?.country || '';
            document.getElementById('openTime').value = settings.operatingHours?.open || '';
            document.getElementById('closeTime').value = settings.operatingHours?.close || '';
            document.getElementById('facebook').value = settings.socialLinks?.facebook || '';
            document.getElementById('instagram').value = settings.socialLinks?.instagram || '';
            document.getElementById('twitter').value = settings.socialLinks?.twitter || '';
            document.getElementById('linkedin').value = settings.socialLinks?.linkedin || '';
        }

        document.getElementById('settingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const data = {
                arenaName: formData.get('arenaName'),
                tagline: formData.get('tagline'),
                phone: formData.get('phone'),
                whatsapp: formData.get('whatsapp'),
                email: formData.get('email'),
                address: {
                    street: formData.get('street'),
                    district: formData.get('district'),
                    country: formData.get('country')
                },
                operatingHours: {
                    open: formData.get('openTime'),
                    close: formData.get('closeTime')
                },
                socialLinks: {
                    facebook: formData.get('facebook'),
                    instagram: formData.get('instagram'),
                    twitter: formData.get('twitter'),
                    linkedin: formData.get('linkedin')
                }
            };

            try {
                await apiCall('/settings', 'PUT', data);
                showAlert('Settings saved successfully');
            } catch (error) {
                showAlert('Failed to save settings', 'danger');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', logout);
        loadSettingsForm();
    </script>
</body>
</html>
