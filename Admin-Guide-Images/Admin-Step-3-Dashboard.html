<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Step 3 - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #fff;
        }
        .card {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid #17a2b8;
            max-width: 800px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #17a2b8;
        }
        .badge {
            display: inline-block;
            background: #17a2b8;
            color: #fff;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2.2em;
            color: #17a2b8;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .stat-card {
            background: rgba(255,255,255,0.05);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(23, 162, 184, 0.3);
        }
        .stat-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .stat-card h3 {
            color: #17a2b8;
            font-size: 1.3em;
            margin-bottom: 5px;
        }
        .stat-card p {
            color: #ccc;
            font-size: 0.95em;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(23, 162, 184, 0.3);
        }
        .footer p {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="badge">ADMIN STEP 3</div>
            <h1>View Dashboard</h1>
        </div>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <h3>Statistics</h3>
                <p>Total bookings, revenue, matches</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon">📅</div>
                <h3>Recent Bookings</h3>
                <p>Latest customer reservations</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <h3>Upcoming Matches</h3>
                <p>Scheduled matches for the week</p>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💰</div>
                <h3>Revenue</h3>
                <p>Track earnings and payments</p>
            </div>
        </div>
        <div class="footer">
            <p>Natz Sports Arena - Admin Panel</p>
        </div>
    </div>
</body>
</html>
