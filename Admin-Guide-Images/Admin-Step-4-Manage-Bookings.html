<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Step 4 - Manage Bookings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #fff;
        }
        .card {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid #ffc107;
            max-width: 800px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #ffc107;
        }
        .badge {
            display: inline-block;
            background: #ffc107;
            color: #000;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2.2em;
            color: #ffc107;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .actions {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
        }
        .action-card {
            background: rgba(255,255,255,0.05);
            padding: 25px 15px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 193, 7, 0.3);
        }
        .action-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        .action-card h3 {
            color: #ffc107;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        .action-card p {
            color: #ccc;
            font-size: 0.9em;
        }
        .note {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid #ffc107;
            padding: 15px;
            border-radius: 8px;
            margin-top: 25px;
            text-align: center;
            color: #ffc107;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 193, 7, 0.3);
        }
        .footer p {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="badge">ADMIN STEP 4</div>
            <h1>Manage Bookings</h1>
        </div>
        <div class="actions">
            <div class="action-card">
                <div class="action-icon">👁️</div>
                <h3>View</h3>
                <p>See all bookings</p>
            </div>
            <div class="action-card">
                <div class="action-icon">✅</div>
                <h3>Approve</h3>
                <p>Confirm reservations</p>
            </div>
            <div class="action-card">
                <div class="action-icon">❌</div>
                <h3>Cancel</h3>
                <p>Cancel bookings</p>
            </div>
        </div>
        <div class="note">
            📱 WhatsApp notifications sent automatically!
        </div>
        <div class="footer">
            <p>Natz Sports Arena - Admin Panel</p>
        </div>
    </div>
</body>
</html>
