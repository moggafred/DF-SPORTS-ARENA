<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Step 2 - Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #fff;
        }
        .card {
            background: linear-gradient(145deg, #0f3460, #16213e);
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
            border: 3px solid #6f42c1;
            max-width: 700px;
            width: 100%;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #6f42c1;
        }
        .badge {
            display: inline-block;
            background: #6f42c1;
            color: #fff;
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .header h1 {
            font-size: 2.2em;
            color: #6f42c1;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .content {
            text-align: center;
        }
        .icon {
            font-size: 5em;
            margin-bottom: 30px;
        }
        .content h2 {
            font-size: 1.6em;
            color: #fff;
            margin-bottom: 20px;
        }
        .credentials {
            background: rgba(111, 66, 193, 0.2);
            border: 2px solid #6f42c1;
            padding: 25px;
            border-radius: 12px;
            margin: 20px 0;
        }
        .credential-row {
            display: flex;
            justify-content: space-between;
            margin: 12px 0;
            font-size: 1.1em;
        }
        .credential-label {
            color: #ccc;
        }
        .credential-value {
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 5px;
            color: #fff;
            font-family: monospace;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid rgba(111, 66, 193, 0.3);
        }
        .footer p {
            color: #888;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="badge">ADMIN STEP 2</div>
            <h1>Enter Login Credentials</h1>
        </div>
        <div class="content">
            <div class="icon">👤</div>
            <h2>Sign In to Admin Panel</h2>
            <div class="credentials">
                <div class="credential-row">
                    <span class="credential-label">Email:</span>
                    <span class="credential-value">admin@natzsportsarena.com</span>
                </div>
                <div class="credential-row">
                    <span class="credential-label">Password:</span>
                    <span class="credential-value">Admin@123</span>
                </div>
            </div>
            <p>Click <strong>Sign In</strong> to access the dashboard</p>
        </div>
        <div class="footer">
            <p>Natz Sports Arena - Admin Panel</p>
        </div>
    </div>
</body>
</html>
